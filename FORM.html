<body>
    <h1>Student Registration Form</h1>
    <form action="submit_form.php" method="post">
        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>
        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>
        <label>Age:</label><br>
        <select name="age" required>
            <option value="">Select Age</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
            <option value="24">24</option>
            <option value="25">25</option>
            <option value="26">26</option>
            <option value="27">27</option>
            <option value="28">28</option>
            <option value="29">29</option>
            <option value="30">30</option>
            <option value="31">31</option>
            <option value="32">32</option>

        </select><br><br>
        <label>Phone Number:</label><br>
        <input type="tel" name="phone" required><br><br>
        <lable>Gender</lable><br>
        <select name="gender" required>
            <option value="">Select Gender</option><br>
            <option value="male">Male</option><br>
            <option value="female">Female</option><br>
            <option value="other">Other</option><br>
        </select><br><br>
        <label>Date of Birth:</label><br>
        <input type="date" name="dob" required><br><br>
        <label>Department:</label><br>
        <select name="department" required>
            <option value="">Select Department</option>
            <option value="computer_science">Computer Science</option>
            <option value="information_technology">Information Technology</option>
            <option value="electronics">Electronics</option>
            <option value="mechanical">Mechanical</option>
            <option value="civil">Civil</option>
            <option value="electrical">Electrical</option>
            <option value="chemical">Chemical</option>
            <option value="biotechnology">Biotechnology</option>
        </select><br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="50" required></textarea><br><br>
        <input type="checkbox" name="agree" required>I agree to the terms and conditions<br><br>
        <!-- <select value="yes">Yes</select><br><br> -->

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>

</html>
