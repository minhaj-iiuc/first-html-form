<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
        }

        .card {
            width: 350px;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .avatar img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #6c5ce7;
            object-fit: cover;
        }

        h2 {
            margin-top: 15px;
            font-size: 24px;
            color: #2d3436;
        }

        .role {
            color: #6c5ce7;
            font-weight: 600;
            margin: 5px 0 15px 0;
        }

        .about {
            color: #636e72;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .socials a img {
            width: 40px;
            height: 40px;
            padding: 8px;
            background: #f0f2f5;
            border-radius: 50%;
            transition: 0.3s;
        }

        .socials a img:hover {
            background: #6c5ce7;
            transform: translateY(-3px);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="avatar">
            <img src="minhaj.jpg" alt="profile">
        </div>
        <h2>MINHJA WEB</h2>
        <p class="role">Web Developer</p>
        <p class="about">
            Passionate about building beautiful & responsive websites.
        </p>
        <div class="socials">
            <a href="form2.html"><img src="website.jpg" alt="website"></a>
            <a href="https://x.com/mminhajuddinbd"><img src="twitter.png" alt="twitter"></a>
            <a href="https://github.com?"><img src="github.webp" alt="github"></a>
            <a href="https://www.instagram.com/mohammedminhaj2121?igsi=MTk4MXFwY2ZuN2lzaw=="><img src="instagram"
                    alt="instagram"></a>
            <a href="https://www.facebook.com/share/1Jnxn1BJzT/"><img src="facbook.jfif" alt="facebook"></a>
        </div>
    </div>
</body>

</html>
